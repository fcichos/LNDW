<script>
// Simulation parameters
const vicsekWidth = document.getElementById('vicsek-canvas').clientWidth;
const vicsekHeight = 350;
let numVicsekParticles = 300;
// Store the current density value to avoid fluctuations in display
let currentDensityValue = 3.0;

// Create SVG container
const vicsekSvg = d3.select("#vicsek-canvas")
  .append("svg")
  .attr("width", vicsekWidth)
  .attr("height", vicsekHeight);

// Add background for better visibility
vicsekSvg.append("rect")
  .attr("width", vicsekWidth)
  .attr("height", vicsekHeight)
  .attr("fill", "#f8f8f8");

// Initialize particles
let vicsekParticles = [];

function initializeVicsekParticles() {
  // Get current density value and convert to particle count
  const densityValue = parseFloat(d3.select("#particle-density").property("value"));
  currentDensityValue = densityValue; // Store the value
  d3.select("#density-value").text(currentDensityValue.toFixed(1)); // Update display once

  numVicsekParticles = Math.round(densityValue * 100); // Map 0-10 density to 0-1000 particles

  vicsekParticles = [];
  for (let i = 0; i < numVicsekParticles; i++) {
    // Random position and direction
    const angle = Math.random() * 2 * Math.PI;
    vicsekParticles.push({
      id: i,
      x: Math.random() * vicsekWidth,
      y: Math.random() * vicsekHeight,
      angle: angle,
      vx: Math.cos(angle),
      vy: Math.sin(angle)
    });
  }
}

// Create particle elements
let particleElements;

function createParticleElements() {
  // Remove existing particles
  vicsekSvg.selectAll(".particle").remove();

  // Create new particles
  particleElements = vicsekSvg.selectAll(".particle")
    .data(vicsekParticles)
    .enter()
    .append("g")
    .attr("class", "particle")
    .attr("transform", d => `translate(${d.x},${d.y})`);

  // Add line for particles to show direction of motion
  particleElements.append("line")
    .attr("x1", 0)
    .attr("y1", 0)
    .attr("x2", d => 6 * d.vx)  // Line length in direction of motion
    .attr("y2", d => 6 * d.vy)
    .attr("stroke", "steelblue")
    .attr("stroke-width", 1.5);
}

function calculateOrderParameter() {
  // Calculate the order parameter φ = |<v>|/v₀
  // where <v> is the average velocity vector and v₀ is the particle speed
  let sumVx = 0;
  let sumVy = 0;

  vicsekParticles.forEach(particle => {
    sumVx += particle.vx;
    sumVy += particle.vy;
  });

  // Average velocity components
  const avgVx = sumVx / vicsekParticles.length;
  const avgVy = sumVy / vicsekParticles.length;

  // Magnitude of average velocity
  const avgSpeed = Math.sqrt(avgVx * avgVx + avgVy * avgVy);

  // Order parameter (normalized by unit speed since |v| = 1 for each particle)
  const orderParameter = avgSpeed;

  return orderParameter;
}

function updateVicsekParticles() {
  // Get current parameter values
  const particleSpeed = parseFloat(d3.select("#particle-speed").property("value"));
  const interactionRadius = parseFloat(d3.select("#interaction-radius").property("value"));
  const noiseLevel = parseFloat(d3.select("#noise-level").property("value"));
  const densityValue = parseFloat(d3.select("#particle-density").property("value"));

  // Don't update density display here to prevent fluctuation
  currentDensityValue = densityValue;

  const targetParticles = Math.round(currentDensityValue * 100);

  // Check if density has changed and reinitialize if needed
  if (targetParticles !== numVicsekParticles) {
    numVicsekParticles = targetParticles;
    initializeVicsekParticles();
    createParticleElements();
    return; // Skip this update cycle to avoid issues
  }

  // Update each particle according to Vicsek model
  vicsekParticles.forEach(particle => {
    // Find neighbors within interaction radius
    const neighbors = vicsekParticles.filter(other => {
      if (other.id === particle.id) return false;

      // Calculate distance with periodic boundary conditions
      let dx = Math.abs(other.x - particle.x);
      let dy = Math.abs(other.y - particle.y);

      // Account for periodic boundaries
      if (dx > vicsekWidth / 2) dx = vicsekWidth - dx;
      if (dy > vicsekHeight / 2) dy = vicsekHeight - dy;

      const distance = Math.sqrt(dx * dx + dy * dy);
      return distance < interactionRadius;
    });

    if (neighbors.length > 0) {
      // Calculate average direction of neighbors
      let avgSin = 0;
      let avgCos = 0;

      neighbors.forEach(neighbor => {
        avgSin += Math.sin(neighbor.angle);
        avgCos += Math.cos(neighbor.angle);
      });

      avgSin /= neighbors.length;
      avgCos /= neighbors.length;

      // New angle is the average angle plus noise
      let newAngle = Math.atan2(avgSin, avgCos);

      // Add noise - consistent with original Vicsek paper scaling
      // η ranges from 0 to 5, with noise applied as η * ξ where ξ ∈ [-π, π]
      newAngle += (Math.random() - 0.5) * 2 * Math.PI * (noiseLevel / 5);

      // Update angle and velocity
      particle.angle = newAngle;
      particle.vx = Math.cos(newAngle);
      particle.vy = Math.sin(newAngle);
    }

    // Update position
    particle.x += particle.vx * particleSpeed;
    particle.y += particle.vy * particleSpeed;

    // Periodic boundary conditions
    if (particle.x < 0) particle.x += vicsekWidth;
    if (particle.x > vicsekWidth) particle.x -= vicsekWidth;
    if (particle.y < 0) particle.y += vicsekHeight;
    if (particle.y > vicsekHeight) particle.y -= vicsekHeight;
  });

  // Calculate and display order parameter
  const orderParameter = calculateOrderParameter();
  d3.select("#order-parameter-value").text(orderParameter.toFixed(3));

  // Update visualization - position and direction
  particleElements.attr("transform", d => `translate(${d.x},${d.y})`)
    .select("line")
    .attr("x2", d => 6 * d.vx)
    .attr("y2", d => 6 * d.vy);
}

// Initialize and start simulation
initializeVicsekParticles();
createParticleElements();

let vicsekTimer = d3.interval(() => {
  updateVicsekParticles();
}, 30);

// Reset button handler
d3.select("#reset-vicsek").on("click", () => {
  vicsekTimer.stop();
  initializeVicsekParticles();
  createParticleElements();
  vicsekTimer = d3.interval(() => {
    updateVicsekParticles();
  }, 30);
});

// Draw interaction radius indicator
const radiusIndicator = vicsekSvg.append("circle")
  .attr("cx", 60)
  .attr("cy", 60)
  .attr("r", 50)
  .attr("fill", "none")
  .attr("stroke", "rgba(70, 130, 180, 0.4)")
  .attr("stroke-width", 1)
  .attr("stroke-dasharray", "5,5");

// Add event handlers for slider value updates to prevent fluctuation
d3.select("#particle-speed").on("input", function() {
  const value = parseFloat(this.value);
  d3.select("#speed-value").text(value.toFixed(1));
});

d3.select("#interaction-radius").on("input", function() {
  const value = parseFloat(this.value);
  d3.select("#radius-value").text(Math.round(value));
  radiusIndicator.attr("r", value);
});

d3.select("#noise-level").on("input", function() {
  const value = parseFloat(this.value);
  d3.select("#noise-value").text(value.toFixed(1));
});

d3.select("#particle-density").on("input", function() {
  const value = parseFloat(this.value);
  d3.select("#density-value").text(value.toFixed(1));
});
</script>

      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
